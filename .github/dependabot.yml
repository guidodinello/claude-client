# Dependabot version-update baseline for a single-package Python repo.
# Distinct from the vulnerability-alert/automated-security-fix settings
# (GitHub API: repos/{owner}/{repo}/vulnerability-alerts and
# .../automated-security-fixes) — those are security-only patches; this
# is routine "keep pinned deps current" PRs on a schedule, for three
# ecosystems: your actual dependencies (pip), your CI Actions pins, and
# your pre-commit hook revs. As of this PR, vulnerability alerts are on
# but automated security fixes are off for this repo.
#
# Note: a floating range (e.g. `ruff>=0.8.0`) already permits any newer
# version, so Dependabot has nothing to bump there and won't open a PR
# — this only helps once a dependency is actually pinned/bounded.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

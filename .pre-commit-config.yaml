repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^tests/fixtures/  # captured responses, kept byte-for-byte
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/  # captured responses, kept byte-for-byte
      - id: check-yaml
      - id: check-toml
      - id: check-json
      # Copier leaves inline conflict markers in a sync PR it couldn't merge
      # (dev-standards' sync.py). --assume-in-merge makes the hook check every file
      # even outside a git merge, so CI stays red on markers in any file, not only
      # the ones check-yaml parses.
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-added-large-files
      - id: debug-statements
        language_version: python3.13

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade
        args: [--py313-plus]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
